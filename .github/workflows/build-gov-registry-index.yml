name: build-gov-registry-index

# Regenerates data/gov_registry_index.json (PR #44, P1: front / rear tyre sizes of the registered vehicles per
# tozeret_cd | degem_cd | shnat_yitzur | ramat_gimur, read by src/gov_registry.py) and opens a pull request with the
# result. Manual only. Source: the data.gov.il registry of private and commercial vehicles (CKAN datastore; resource id
# from the GOV_REGISTRY_RESOURCE_ID repository variable, else the script's default). Fail-closed: the script verifies the
# resource's columns first (zmig_kidmi / zmig_ahori included) and exits non-zero writing nothing when one is missing or a
# page fails; no pull request is opened then. Paged reads with a pause between pages (polite rate). The build log ends
# with its diagnostics (top unparsed tyre strings, keys dropped for n < 20 vs unparsed sizes, per-manufacturer counts)
# and scripts/gov_registry_coverage.py prints which benchmark / catalog records have an entry (PR #45) and, for each
# benchmark record without one, why (no key / n < 20 / unparsed sizes / level B used). The coverage step runs
# with if: always(), so it also reports (on the index in the checkout) when the build or the pull request step failed.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build the index (fails closed, writes nothing on a missing column)
        env:
          GOV_REGISTRY_RESOURCE_ID: ${{ vars.GOV_REGISTRY_RESOURCE_ID }}
        run: python scripts/build_gov_registry_index.py
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/gov-registry-index
          commit-message: Regenerate data/gov_registry_index.json
          title: Regenerate the government registry tyre index
          body: Regenerated by the build-gov-registry-index workflow (scripts/build_gov_registry_index.py).
          add-paths: data/gov_registry_index.json
      - name: Coverage report (benchmark Level 1.5 records and catalog records with an index entry, reasons)
        if: always()
        run: python scripts/gov_registry_coverage.py
