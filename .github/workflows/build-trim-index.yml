name: build-trim-index

# Regenerates data/catalog_trim_index.json (the government catalog's trims per technical variant, read by the
# single_trim_catalog binding rule) and opens a pull request with the result. Manual only. PR #47 (B2): the server keeps
# the index current itself (a weekly rebuild from DATABASE_URL into its data volume, src/jobs/derived_index.py), so this
# workflow needs no database secret: its source is the data.gov.il datastore resource in the GOV_CATALOG_RESOURCE_ID
# repository variable. Without it the script fails; it never writes the benchmark-only index here.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build the index
        env:
          GOV_CATALOG_RESOURCE_ID: ${{ vars.GOV_CATALOG_RESOURCE_ID }}
        run: python scripts/build_trim_index.py --source ckan
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/catalog-trim-index
          commit-message: Regenerate data/catalog_trim_index.json
          title: Regenerate the catalog trim index
          body: Regenerated by the build-trim-index workflow (scripts/build_trim_index.py).
          add-paths: data/catalog_trim_index.json
