name: build-open-data

# Builds the open-data snapshots (EEA, ADEME, EPA, NRCan, CVS) on the runner (network + runner disk) and opens a pull
# request committing them to data/open/ (<dataset>.sqlite.gz + manifest.json + probe.json): the deploy image carries
# them and the server reads them from the image; nothing is built or written on the data volume. The same pattern as
# build-gov-registry-index. No secret.
#
#   1. live-schema probe: per dataset / year / file the live header or field schema and its resolution against
#      data/open_datasets.json (step summary + artifact + data/open/probe.json); a dataset whose probe fails is not
#      built (the failure stops only that dataset)
#   2. make aliases from data/make_canonical.json (scripts/build_make_aliases.py: the probe's distinct source makes
#      that normalize to a canonical make; spellings per dataset and rows kept vs total go to the PR body), then build
#      with src/open_data/build.py, compacted (data/open_datasets.json `compaction`); the build summary prints per
#      dataset rows kept / total and the kept makes
#   3. compress to data/open/<dataset>.sqlite.gz (EEA: one shard per year, data/open/eea_co2_cars/<year>.sqlite.gz, a
#      year over 50 MB split by make initial); a file still over 50 MB is not written and listed as a warning, the step
#      fails only when nothing at all was written, and the steps below run either way: one dataset never costs the others
#   4. coverage BEFORE the pull-request step (create-pull-request resets the checkout to main): rows per dataset / year /
#      file, absent columns, and the route / match per benchmark record (+ 85095, 23678, 38626, 101136, 22010)
#   5. pull request on automation/open-data with the summaries in its body (always, so the datasets that were written are
#      never lost to one that was not). Creating it needs the repository setting
#      "Allow GitHub Actions to create and approve pull requests" (Settings -> Actions -> General); without it the
#      branch is still pushed and the last step writes the compare URL to open the pull request by hand

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Datasets to build: all, or a comma-separated list (eea_co2_cars, ademe_car_labelling, epa_fueleconomy, nrcan_fuel_ratings, tc_cvs)"
        required: false
        default: all
  schedule:
    - cron: "17 3 2 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATASETS: ${{ inputs.datasets || 'all' }}
      OPEN_DATA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Live-schema probe (per dataset / year / file; failures stop only that dataset)
        run: python scripts/probe_open_data.py --datasets "$DATASETS" --out data/open/probe.json --markdown open-data-probe.md
      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-data-probe
          path: |
            data/open/probe.json
            open-data-probe.md
          if-no-files-found: ignore
      - name: Make aliases from the canonical make table (spellings per dataset, rows kept vs total)
        run: python scripts/build_make_aliases.py --probe data/open/probe.json --out data/open_data_make_aliases.json --review open-data-makes.md
      - name: Build and compress the snapshots (each file under 50 MB; fails only when nothing was written)
        run: python scripts/build_open_data.py --datasets "$DATASETS" --out data/open --probe data/open/probe.json --summary open-data-build.md --max-mb 50
      - name: Coverage report (before the pull request step)
        if: always()
        run: python scripts/open_data_coverage.py --open data/open --build open-data-build.md --makes open-data-makes.md --body open-data-pr-body.md
      - name: Open a pull request
        id: cpr
        if: always()
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/open-data
          commit-message: Rebuild the open-data snapshots (data/open)
          title: Rebuild the open-data snapshots
          body-path: open-data-pr-body.md
          add-paths: |
            data/open/*.sqlite.gz
            data/open/*/*.sqlite.gz
            data/open/manifest.json
            data/open/probe.json
            data/open_data_make_aliases.json
      - name: Pull request fallback (the repository does not let Actions create pull requests)
        if: always() && steps.cpr.outcome == 'failure'
        run: |
          {
            echo "## Open the pull request by hand"
            echo ""
            echo "The pull request step failed (often: GitHub Actions is not permitted to create or approve pull requests; enable it under Settings -> Actions -> General -> \"Allow GitHub Actions to create and approve pull requests\"). If the branch was pushed, open the pull request here:"
            echo ""
            echo "https://github.com/${{ github.repository }}/compare/main...automation/open-data?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
